<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TEF Dressage Handbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;700&display=swap">
<!-- Dressage-only app prototype. Built by tools/build_pages.py: the handbook core (form, paper, pagination, logos)
     is copied from tools/builder.src.html at the /*@@...@@*/ markers, so fix handbook behaviour there, not here. -->
<style>
/* Layout: sticky app bar with four views; the builder is a form rail on the left and A4 "paper" pages on the right, stacking on phones */
:root{
  --bg:#E6EBF2; --surface:#E6EBF2; --surface-2:#DCE2EA; --ink:#2A3443; --ink-2:#4A5566; --ink-3:#5D687A; --line:#CDD5E0;
  --accent:#0A7383; --accent-2:#13B5C6; --accent-soft:rgba(31,240,214,.18); --on-accent:#04343C;
  --grad:linear-gradient(135deg,#1FF0D6,#2BC2E3); --glow:0 8px 18px -8px rgba(32,200,214,.75);
  --field:#E6EBF2; --field-hi:#EEF2F7; --line-strong:#B3BDCB; --edge:rgba(255,255,255,.6);
  --sh-dark:rgba(163,177,198,.78); --sh-light:rgba(255,255,255,.95);
  --raise:7px 7px 16px var(--sh-dark),-7px -7px 16px var(--sh-light); --raise-sm:3px 3px 8px var(--sh-dark),-3px -3px 8px var(--sh-light);
  --press:inset 3px 3px 7px var(--sh-dark),inset -3px -3px 7px var(--sh-light);
  --lock:#B42318; --lock-soft:#FCE9E7; --fill:#8A6A00; --fill-strong:#F2C200; --fill-soft:#FFF5C4;
  --value:#0D6A70; --value-soft:#DCF0EF; --prop:#6236C9; --prop-soft:#EEE8FC;
  --ok:#1D7445; --ok-soft:#E0F2E7; --warn:#A44C06; --warn-soft:#FDEFDF;
  --dr:#0E8E9C; --jp:#2E7D4A; --ev:#A35F14;
  --paper:#FFFFFF; --paper-ink:#151515; --paper-muted:#6B6F76; --paper-line:#C9CDD3; --paper-red:#C8102E;
  --paper-lock:#FCE4E1; --paper-lock-rule:#D92D20; --paper-fill:#FFE53B; --paper-fill-soft:#FFF6B8; --paper-fill-rule:#D9B200;
  --paper-prop:#7B4DFF; --paper-prop-soft:#F1ECFF; --paper-ok:#1D7445; --paper-chg:#E8590C; --paper-shadow:rgba(20,30,48,.13); --paper-sel:#12A7B8;
  --font-ui:"FEI","Sukhumvit Set","IBM Plex Sans Thai","Noto Sans Thai",system-ui,-apple-system,sans-serif; /* English = FEI, Thai = Sukhumvit Set */
  --font-doc:"FEI","Sukhumvit Set","Sarabun","Noto Sans Thai",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F252D; --surface:#1F252D; --surface-2:#262D37; --ink:#E4E9F0; --ink-2:#AEB8C6; --ink-3:#8E99A9; --line:#303843;
  --accent:#3FE0D0; --accent-2:#2BC2E3; --accent-soft:rgba(31,240,214,.13); --on-accent:#04343C;
  --grad:linear-gradient(135deg,#1FF0D6,#2BC2E3); --glow:0 8px 18px -8px rgba(31,240,214,.45);
  --field:#1F252D; --field-hi:#262E38; --line-strong:#3C4652; --edge:rgba(255,255,255,.03);
  --sh-dark:rgba(8,10,14,.72); --sh-light:rgba(54,64,77,.5);
  --lock:#F28B80; --lock-soft:#3A1E1C; --fill:#F0CE5A; --fill-strong:#F2C200; --fill-soft:#383014;
  --value:#62C9CC; --value-soft:#133639; --prop:#B7A0FF; --prop-soft:#2A2148;
  --ok:#62C690; --ok-soft:#163626; --warn:#F2A65A; --warn-soft:#3A2814;
  --dr:#3FD0D6; --jp:#7FC792; --ev:#E3A35F; --paper-shadow:rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1F252D; --surface:#1F252D; --surface-2:#262D37; --ink:#E4E9F0; --ink-2:#AEB8C6; --ink-3:#8E99A9; --line:#303843;
  --accent:#3FE0D0; --accent-2:#2BC2E3; --accent-soft:rgba(31,240,214,.13); --on-accent:#04343C;
  --grad:linear-gradient(135deg,#1FF0D6,#2BC2E3); --glow:0 8px 18px -8px rgba(31,240,214,.45);
  --field:#1F252D; --field-hi:#262E38; --line-strong:#3C4652; --edge:rgba(255,255,255,.03);
  --sh-dark:rgba(8,10,14,.72); --sh-light:rgba(54,64,77,.5);
  --lock:#F28B80; --lock-soft:#3A1E1C; --fill:#F0CE5A; --fill-strong:#F2C200; --fill-soft:#383014;
  --value:#62C9CC; --value-soft:#133639; --prop:#B7A0FF; --prop-soft:#2A2148;
  --ok:#62C690; --ok-soft:#163626; --warn:#F2A65A; --warn-soft:#3A2814;
  --dr:#3FD0D6; --jp:#7FC792; --ev:#E3A35F; --paper-shadow:rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:1480px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .seal{flex:none;width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 11px/1 var(--font-mono);letter-spacing:.06em}
.brand b{display:block;font-size:15px}
.brand small{display:block;color:var(--ink-3);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11.5px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
.tabs a{padding:7px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap;font-size:14px}
.tabs a:hover{background:var(--surface-2);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{padding-block:18px 56px}

/* builder controls */
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:500}
.seg button .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.seg button small{color:var(--ink-3);font-weight:400;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.sw input{accent-color:var(--accent);width:16px;height:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13.5px;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.sim{border-style:dashed;color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.legend b{font-weight:600;color:var(--ink)}
.sw-chip{display:inline-flex;align-items:center;gap:6px}
.sw-chip i{display:inline-block;width:22px;height:14px;border-radius:3px;font-style:normal;font:500 10px/14px var(--font-mono);text-align:center;color:#151515}
.k-lock{background:var(--paper-lock);box-shadow:inset 3px 0 var(--paper-lock-rule)}
.k-fill{background:var(--paper-fill)}
.k-colon{background:var(--paper-fill-soft);border-bottom:2px solid var(--paper-fill-rule)}
.k-x{background:var(--paper-fill-soft);border-bottom:2px solid var(--paper-fill-rule)}
.k-prop{background:var(--paper-prop-soft);outline:1.5px dashed var(--paper-prop);outline-offset:-1.5px}

.work{display:grid;grid-template-columns:minmax(330px,410px) minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - 92px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;padding-bottom:8px;scrollbar-width:thin}
@media (max-width:980px){.work{grid-template-columns:minmax(0,1fr)}.rail{position:static;max-height:none;overflow:visible;padding-right:0}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.prog{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog-row b{font-size:22px;font-variant-numeric:tabular-nums}
.prog-row span{color:var(--ink-3);font-size:13px}
.meter{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--fill-strong);border-radius:99px;transition:width .25s}
.meter.done i{background:var(--ok)}
.miss{border-top:1px dashed var(--line);padding-top:8px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.miss b{color:var(--warn)}
.miss ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.miss button{border:1px solid var(--line);background:var(--fill-soft);border-radius:6px;padding:2px 8px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.banner{padding:10px 12px;border-radius:10px;font-size:13.5px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.ok{background:var(--ok-soft);border-color:transparent}
.banner.info{background:var(--accent-soft);border-color:transparent}
.banner b{display:block;margin-bottom:2px}

fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:10px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.sec>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-left:4px;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
.sum-t{flex:1;min-width:0}
.cnt{font:500 12px var(--font-mono);padding:1px 8px;border-radius:99px;background:var(--fill-soft);color:var(--fill);font-variant-numeric:tabular-nums}
.cnt.done{background:var(--ok-soft);color:var(--ok)}
.cnt.lk{background:var(--lock-soft);color:var(--lock)}
.sec-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.fld .lab{font-size:13px;font-weight:500;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mk{font:500 10.5px/1.5 var(--font-mono);padding:0 6px;border-radius:4px;white-space:nowrap}
.mk-fill{background:var(--fill-soft);color:var(--fill)}
.mk-colon{background:var(--fill-soft);color:var(--fill)}
.mk-x{background:var(--value-soft);color:var(--value)}
.mk-prop{background:var(--prop-soft);color:var(--prop);outline:1px dashed var(--prop);outline-offset:-1px}
.mk-auto{background:var(--accent-soft);color:var(--accent)}
.mk-own{background:var(--warn-soft);color:var(--warn)}
.cover-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.v[data-cover]{white-space:pre-line}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14.5px;min-width:0}
.inp:focus{border-color:var(--accent);outline:2px solid var(--accent-soft);outline-offset:0}
.inp.need{box-shadow:inset 3px 0 var(--fill-strong)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
.unit{display:flex;align-items:center;gap:8px}
.unit span{font-size:13px;color:var(--ink-3);white-space:nowrap}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair label{font-size:12px;color:var(--ink-3)}
.hint{font-size:12px;color:var(--ink-3)}
.derived{font-size:13.5px;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:7px 10px;color:var(--ink-2)}
.prow{display:flex;gap:6px;align-items:center}
.prow .n{font:500 11px var(--font-mono);color:var(--ink-3);width:16px;text-align:right;flex:none}
.rm{flex:none;border:1px solid var(--line);background:var(--surface);width:30px;height:32px;border-radius:7px;cursor:pointer;color:var(--ink-3)}
.rm:hover{color:var(--lock);border-color:var(--lock)}
.add{align-self:flex-start;border:1px dashed var(--line);background:transparent;border-radius:7px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--accent)}
.lockcard{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-2)}
.lockcard ul{margin:0;padding-left:18px}
.lockcard li.px{color:var(--prop)}
.cmt{font-size:12.5px;background:var(--warn-soft);border-radius:8px;padding:6px 9px;color:var(--ink)}
.cmt b{color:var(--warn)}
fieldset:disabled .add,fieldset:disabled .rm{display:none}
fieldset:disabled .inp{background:var(--surface-2);color:var(--ink-2)}

/* status track above the paper */
.docwrap{min-width:0;display:flex;flex-direction:column;gap:12px}
.status{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.track{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.track .st{display:flex;align-items:center;gap:6px;color:var(--ink-3);white-space:nowrap}
.track .st i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:600 10px var(--font-mono);font-style:normal}
.track .st.done{color:var(--ok)} .track .st.done i{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.track .st.cur{color:var(--ink);font-weight:600} .track .st.cur i{border-color:var(--accent);color:var(--accent)}
.track .st.ret{color:var(--warn);font-weight:600} .track .st.ret i{border-color:var(--warn);color:var(--warn)}
.track .ln{width:18px;height:2px;background:var(--line)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ver{font:500 12px var(--font-mono);color:var(--ink-3)}

/* the paper */
.doc{display:flex;flex-direction:column;align-items:center;gap:20px}
.page{position:relative;width:100%;max-width:794px;aspect-ratio:210/297;background:var(--paper);color:var(--paper-ink);box-shadow:0 1px 2px var(--paper-shadow),0 10px 28px var(--paper-shadow);padding:44px 58px 22px;display:flex;flex-direction:column;font-family:var(--font-doc);font-size:16px;line-height:1.5}
.page .body{flex:1}
.pfoot{margin-top:28px;border-top:1px solid var(--paper-line);padding-top:6px;display:flex;justify-content:flex-end;gap:16px;font-size:.78em;color:var(--paper-muted)}
.pfoot .pn{font-variant-numeric:tabular-nums}
.cover .body{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.25em}
.d-title{font-size:2em;font-weight:700;line-height:1.35}
.d-title.en{font-family:var(--font-doc);font-size:1.75em}
.d-disc{margin-top:1.4em;font-size:1.15em;font-weight:500;padding:.15em .8em;border-radius:3px}
.d-h{font-weight:700;text-align:center;text-decoration:underline;text-underline-offset:3px;margin:1.1em 0 .35em;font-size:1.04em}
.d-h:first-child{margin-top:0}
.d-sh{font-weight:700;text-decoration:underline;text-underline-offset:3px;margin:.7em 0 .15em}
.d-h3{font-weight:700;margin:1em 0 .15em}
.kv{display:grid;grid-template-columns:minmax(0,20.5em) 1.1em minmax(0,1fr);align-items:baseline}
.kv .c{text-align:center}
.kv.li .k{padding-left:1.6em;text-indent:-1.3em}
.d-p{margin:.1em 0 .45em;text-indent:2.4em}
.d-note{color:var(--paper-red);margin:.05em 0}
.d-ol{margin:.2em 0 .4em;padding-left:2.2em}
.d-ol li{margin:.05em 0}
.coc-t{font-weight:700;text-align:center;margin:.9em 0 0}
.coc-en{font-weight:700;text-align:center;margin:0 0 .4em}
.coc-sec{font-weight:700;margin:.6em 0 .05em}
.coc-item{font-weight:700;margin:.25em 0 0 1.4em}
.coc-p{margin:0 0 .15em 1.4em}
.coc-cite{font-style:italic;font-size:.9em;margin-top:.6em}
.lockblk{position:relative;margin:.4em 0}
.lk-tag{display:none}
.v{border-radius:2px}
.v.empty{color:var(--paper-muted)}

/* template marks: shown when "แสดงสีแม่แบบ" is on */
.doc.marks .lockblk{background:var(--paper-lock);box-shadow:inset 3px 0 var(--paper-lock-rule);padding:.5em .9em .5em 1.1em}
.doc.marks .lk-tag{display:inline-flex;position:absolute;top:-.85em;right:.6em;align-items:center;gap:4px;background:var(--paper-lock-rule);color:#fff;font:500 10.5px/1 var(--font-ui);padding:3px 7px;border-radius:99px}
.doc.marks .v{background:var(--paper-fill-soft);box-shadow:inset 0 -2px var(--paper-fill-rule);padding:0 .15em;cursor:pointer}
.doc.marks .v.empty{background:var(--paper-fill);box-shadow:none;color:#5B4A00}
.doc.marks .v:hover{outline:1.5px solid var(--paper-ink)}
.doc.marks .v.m-prop{background:var(--paper-prop-soft);box-shadow:none;outline:1.5px dashed var(--paper-prop);outline-offset:-1px}
.doc.marks .v.m-prop.empty{color:var(--paper-prop)}
.doc.marks .propblk{outline:1.5px dashed var(--paper-prop);outline-offset:2px;background:var(--paper-prop-soft);border-radius:2px;position:relative}
.doc.marks .d-ol li.px{background:var(--paper-prop-soft);outline:1.5px dashed var(--paper-prop);outline-offset:1px}
.doc.marks .chg{box-shadow:-10px 0 0 -6px var(--paper-chg)}
.doc.marks .kv.chg,.doc.marks .d-p.chg{box-shadow:-12px 0 0 -8px var(--paper-chg)}
.v.hot{outline:2px solid var(--accent-2)!important;outline-offset:2px}
.v:not(.empty){color:inherit}
.doc:not(.marks) .v{cursor:pointer}
.stamp{position:absolute;top:44px;right:46px;transform:rotate(-8deg);border:2.5px solid var(--paper-ok);color:var(--paper-ok);font:700 13px/1.25 var(--font-ui);padding:6px 12px;border-radius:6px;text-align:center;letter-spacing:.02em;background:var(--paper)}
.stamp small{display:block;font-weight:500;font-size:11px}
@media (max-width:640px){
  .page{padding:22px 18px 14px;font-size:13px;aspect-ratio:auto;min-height:0}
  .kv{grid-template-columns:minmax(0,1fr) .9em minmax(0,1.15fr)}
  .d-title{font-size:1.6em}
  .stamp{top:14px;right:12px;font-size:11px}
}

/* reading views */
.read{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.lead{max-width:72ch;color:var(--ink-2);font-size:16px;margin:.4em 0 0}
.eyebrow{font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.read h1{font-size:28px;margin-top:4px}
.read h2{font-size:20px;margin-bottom:10px}
.read p{max-width:75ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);background:var(--surface-2);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.grid3{grid-template-columns:minmax(0,1fr)}}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.opt.rec{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt h3{font-size:16px}
.opt .pill{align-self:flex-start;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--accent);color:var(--on-accent)}
.opt ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.opt .pro{color:var(--ok);font-weight:600;font-size:13px}
.opt .con{color:var(--warn);font-weight:600;font-size:13px}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.list li{max-width:85ch}
.q{counter-reset:q;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.q li{counter-increment:q;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.q li::before{content:counter(q);font:600 12px/24px var(--font-mono);text-align:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent)}
.disc-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12.5px;padding:1px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.chip.px{background:var(--prop-soft);border:1px dashed var(--prop);color:var(--prop)}

/* workflow */
.lanes{display:grid;grid-template-columns:150px repeat(8,minmax(150px,1fr));min-width:1380px;font-size:13px}
.lanes .hd{font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line);color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.lanes .hd small{font:500 11px var(--font-mono);color:var(--ink-3)}
.lanes .ln-name{padding:10px;font-weight:600;border-bottom:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.lanes .ln-name small{font-weight:400;color:var(--ink-3);font-size:12px}
.lanes .cell{padding:8px 6px;border-bottom:1px solid var(--line);border-left:1px dashed var(--line)}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;gap:4px;height:100%}
.wcard .ph{align-self:flex-start;font:500 10.5px var(--font-mono);padding:0 6px;border-radius:4px}
.ph-mvp{background:var(--accent);color:var(--on-accent)}
.ph-2{background:var(--accent-soft);color:var(--accent)}
.ph-3{background:var(--value-soft);color:var(--value)}
.ph-4{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow .s{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.flow .s small{display:block;font:400 11.5px var(--font-mono);color:var(--ink-3)}
.flow .s.k1{border-color:var(--fill-strong);background:var(--fill-soft)}
.flow .s.k2{border-color:var(--accent);background:var(--accent-soft)}
.flow .s.k3{border-color:var(--warn);background:var(--warn-soft)}
.flow .s.k4{border-color:var(--ok);background:var(--ok-soft)}
.flow .ar{color:var(--ink-3)}
.timeline{position:relative;margin:8px 0 4px;padding-top:6px}
.tl-axis{position:relative;height:2px;background:var(--line);margin:34px 8px 54px}
.tl-pt{position:absolute;top:-6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:130px;text-align:center}
.tl-pt i{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl-pt.ev i{background:var(--accent)}
.tl-pt span{font-size:12.5px;line-height:1.3;color:var(--ink-2)}
.tl-pt b{position:absolute;bottom:22px;font:500 11.5px var(--font-mono);color:var(--ink-3);white-space:nowrap}

/* roadmap */
.phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.phases{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.phases{grid-template-columns:minmax(0,1fr)}}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.phase.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.phase .pn{font:500 12px var(--font-mono);color:var(--ink-3)}
.phase h3{font-size:16px}
.phase ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.ent{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.ent{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.ent{grid-template-columns:minmax(0,1fr)}}
.ent div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.ent b{display:block;font:600 13px var(--font-mono);color:var(--ink);margin-bottom:3px}
/* signed-in user + roles */
.who{display:flex;align-items:center;gap:8px}
.who .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:14px}
.who-t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.who-t b{font-size:13px} .who-t small{font-size:11.5px;color:var(--ink-3)}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wait{font-size:13px;color:var(--ink-3)}
.work.pub{grid-template-columns:minmax(0,1fr)} .work.pub .rail{display:none}
#v-builder.pub .legend{display:none} #v-builder.pub .v{cursor:default}
.login-row{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.login-row{grid-template-columns:minmax(0,1fr)}}
.login-mock{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.login-mock .seal{width:52px;height:52px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 15px/1 var(--font-mono);letter-spacing:.06em}
.login-mock h3{font-size:19px;margin-top:4px}
.login-mock p{margin:0;color:var(--ink-2);font-size:14px}
.login-mock small{color:var(--ink-3);font-size:12px}
.gbtn{width:100%;padding:10px 14px;font-size:15px;margin-top:8px}
.demo{width:100%;border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:6px;text-align:left}
#demo-accounts{display:flex;flex-direction:column;gap:6px}
.acct{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;color:var(--ink)}
.acct:hover{border-color:var(--accent)}
.acct small{color:var(--ink-3);font-size:12px}
.demo.flash .acct{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
.steps li::before{content:counter(s);grid-row:span 2;font:600 13px/26px var(--font-mono);width:26px;height:26px;border-radius:50%;text-align:center;background:var(--accent-soft);color:var(--accent)}
.steps li b{color:var(--ink)}
.role-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.role-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.role-grid{grid-template-columns:minmax(0,1fr)}}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2)}
.rcard b{color:var(--ink);font-size:15px} .rcard small{color:var(--ink-3);font-size:12.5px}
.rcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
table.perm td.c,table.perm th:not(:first-child){text-align:center}
table.perm .hl{background:var(--accent-soft)}
.perm .ok{color:var(--ok);font-weight:700} .perm .no{color:var(--ink-3)} .perm .part{font-size:12.5px;color:var(--warn);white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel.parked{border-style:dashed}

/* ---- soft UI layer: neumorphic surfaces raised from one pale grey, turquoise accent ---- */
body{background:var(--bg)}
.top{background:var(--bg);border-bottom:0;box-shadow:0 8px 18px -12px var(--sh-dark)}
.brand .seal,.login-mock .seal{background:var(--surface);color:var(--accent);border-radius:50%;box-shadow:var(--raise-sm)}
.brand .seal{width:40px;height:40px}
.login-mock .seal{width:60px;height:60px}
.brand small{letter-spacing:.04em}
.tabs,.seg{background:var(--surface);border:0;border-radius:999px;padding:5px;box-shadow:var(--press)}
.tabs a,.seg button{border-radius:999px;padding:6px 14px}
.tabs a:hover{background:transparent;color:var(--accent)}
.tabs a[aria-current="page"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--raise-sm)}
.seg button[aria-pressed="true"]{color:var(--ink)}
.card,details.sec,.status,.legend,.panel,.opt,.phase,.rcard,.login-mock,.tbl-wrap,.steps li{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--raise)}
.ent div,.wcard,.acct{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--raise-sm)}
.card,details.sec,.status,.opt,.phase,.rcard,.steps li,.tbl-wrap,.legend{border-radius:20px}
.panel,.login-mock{border-radius:24px}
.ent div,.wcard,.acct{border-radius:14px}
.bar,.legend{margin-bottom:18px}
.work{gap:28px}
.rail{gap:16px;padding:12px 14px 18px 12px;margin:-12px -14px -18px -12px}
fieldset{gap:16px}
.docwrap{gap:20px}
.sec-body{border-top-color:var(--line)}
.btn{border:0;border-radius:999px;padding:7px 15px;background:var(--surface);color:var(--ink-2);box-shadow:var(--raise-sm)}
.btn:hover{color:var(--accent)}
.btn:active{box-shadow:var(--press)}
.btn.primary,.btn.primary:hover{background:var(--grad);color:var(--on-accent);font-weight:600;box-shadow:var(--raise-sm),var(--glow)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sim{background:transparent;box-shadow:none;border:1.5px dashed var(--line-strong)}
.inp,.sel{background:var(--field);border:1px solid transparent;box-shadow:var(--press)}
.inp{border-radius:14px}
.sel{border-radius:999px;padding:6px 12px}
.inp.need{box-shadow:var(--press),inset 3px 0 var(--fill-strong)}
.inp:focus{border-color:var(--accent-2);outline:0;box-shadow:var(--press),0 0 0 3px var(--accent-soft)}
.rm{border:0;border-radius:12px;background:var(--surface);box-shadow:var(--raise-sm)}
.rm:active,.add:active{box-shadow:var(--press)}
.add{border:0;border-radius:999px;padding:5px 13px;background:var(--surface);color:var(--accent);box-shadow:var(--raise-sm)}
.banner{border-radius:16px;border:0}
.tag{background:var(--surface);border:0;box-shadow:var(--press)}
.meter{height:10px;background:var(--surface);border:0;box-shadow:var(--press)}
.meter i{background:var(--grad)}
.meter.done i{background:var(--ok)}
.sw input{accent-color:var(--accent-2)}
.who .av{background:var(--surface);color:var(--accent);box-shadow:var(--raise-sm)}
.opt.rec,.phase.now,.rcard.on{border-color:var(--accent-2);box-shadow:var(--raise),0 0 0 2px var(--accent-2)}
.opt .pill,.ph-mvp{background:var(--grad);color:var(--on-accent)}
.q li::before,.steps li::before{background:var(--surface);color:var(--accent);box-shadow:var(--raise-sm)}
.track .st.cur i{border-color:var(--accent-2);color:var(--accent)}
.miss button,.chip,.flow .s{border-radius:999px}
.eyebrow{font-family:var(--font-ui);letter-spacing:.02em}
.page{border-radius:6px;box-shadow:8px 8px 22px var(--sh-dark),-6px -6px 18px var(--sh-light)}
@media (max-width:980px){.rail{padding:0;margin:0}}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
@media (max-width:640px){.seg{display:flex;flex-direction:column;align-items:stretch;border-radius:26px}.seg button{justify-content:flex-start}}
@media (max-width:640px){.page.cover{aspect-ratio:210/297}}


/* ---- logo slots on the cover: unlimited, drag to move, corner handle to resize ---- */
.page.cover{overflow:hidden}
.logos{position:absolute;inset:0;pointer-events:none;z-index:1}
.stamp{z-index:3}
.logo{position:absolute;pointer-events:auto;display:grid;place-items:center;border-radius:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.logo img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.logo.empty{border:1.5px dashed var(--paper-prop);background:var(--paper-prop-soft);color:var(--paper-prop);font:500 10px/1.25 var(--font-ui);text-align:center;padding:4px;overflow:hidden}
.logo.empty b{display:block;font:600 11px/1.4 var(--font-mono);letter-spacing:.16em}
.logos.edit .logo{cursor:grab}
.logos.edit .logo:hover{outline:1.5px solid var(--paper-sel);outline-offset:3px}
.logo.sel{outline:2px solid var(--paper-sel)!important;outline-offset:3px}
.logo.drag{cursor:grabbing;opacity:.88}
.logo .lx,.logo .lr,.logo .ltag{display:none;position:absolute}
.logo .lx{top:-12px;right:-12px;width:24px;height:24px;border-radius:50%;border:2px solid var(--paper);background:var(--paper-ink);color:var(--paper);font:600 13px/1 var(--font-ui);cursor:pointer;padding:0}
.logo .lr{right:-8px;bottom:-8px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:2.5px solid var(--paper-sel);cursor:nwse-resize}
.logo .ltag{left:-2px;bottom:calc(100% + 8px);white-space:nowrap;font:500 10.5px/1 var(--font-ui);background:var(--paper-sel);color:var(--paper);padding:4px 8px;border-radius:999px}
.logo.sel .lx,.logo.sel .lr,.logo.sel .ltag{display:block}
.guide{position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed var(--paper-sel);display:none}
.logos.snap .guide{display:block}
.page.cover.drop{outline:2px dashed var(--paper-sel);outline-offset:-12px}
.logo-list{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto 30px;gap:6px;align-items:center;border-radius:12px}
.lthumb{width:48px;height:34px;border-radius:9px;border:1px dashed var(--line-strong);background:var(--field);display:grid;place-items:center;overflow:hidden;font:600 9px var(--font-mono);letter-spacing:.12em;color:var(--ink-3);cursor:pointer;padding:2px}
.lthumb.has{border-style:solid;border-color:var(--line);background:var(--paper)}
.lthumb img{width:100%;height:100%;object-fit:contain}
.lrow.on .lthumb{outline:2px solid var(--accent-2);outline-offset:1px}
.btn.up{padding:5px 11px;font-size:12.5px;white-space:nowrap}
.logo-add{display:flex;flex-wrap:wrap;gap:6px}
fieldset:disabled .btn.up{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---- Dressage app ---- */
.demo-strip{background:var(--warn-soft);color:var(--ink);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding-block:7px}
.demo-strip b{color:var(--warn)}
.demo-strip .btn{padding:3px 11px;font-size:12.5px}
.demo-strip .sp{flex:1}
.login-wrap{display:grid;place-items:center;padding:28px 0 56px}
.login-wrap .login-mock{max-width:430px;width:100%}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.s-returned{background:var(--warn-soft);color:var(--warn)}
.pill.s-admin,.pill.s-review,.pill.s-admin2,.pill.s-approval{background:var(--accent-soft);color:var(--accent)}

.late{color:var(--lock);font-weight:600}
.soon{color:var(--warn);font-weight:600}
.okc{color:var(--ok);font-weight:600}
.muted{color:var(--ink-3)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--lock);color:#fff;font-size:11px;font-weight:600;margin-left:4px;line-height:1}
.empty{text-align:center;color:var(--ink-3);padding:28px 12px}
.row-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.head-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.wflow{display:flex;flex-direction:column;gap:12px}
.wflow .panel{padding:14px 16px}
.wflow h3{font-size:15px;margin-bottom:6px}
.flash{border-radius:16px;padding:10px 14px;font-size:14px;background:var(--warn-soft)}
.flash.ok{background:var(--ok-soft)}
.cmts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cmts li{background:var(--warn-soft);border-radius:12px;padding:8px 11px;font-size:14px}
.cmts small{display:block;color:var(--ink-3);font-size:12px}
.hist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--ink-2)}
.hist time{display:block;color:var(--ink-3);font-size:12px}
details.more>summary{cursor:pointer;font-weight:600;font-size:14px}
.mail-list{display:flex;flex-direction:column;gap:10px}

details.mail>summary::-webkit-details-marker{display:none}
details.mail>summary b{font-size:14.5px}
details.mail>summary small{color:var(--ink-3);font-size:12.5px}
.mail-meta{font-size:13px;color:var(--ink-2);margin:8px 0 6px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px}
.mail-body{white-space:pre-wrap;font:14px/1.6 var(--font-ui);background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:0}
.att{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;padding:1px 9px;border-radius:999px;border:1px dashed var(--line-strong);color:var(--ink-2);margin:6px 6px 0 0}
dialog.dlg{border:0;border-radius:22px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--raise);width:min(560px,calc(100vw - 32px))}
dialog.dlg::backdrop{background:rgba(20,28,40,.38)}
.dlg form{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h3{font-size:18px}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.crow{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end}
@media (max-width:720px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
td .inp{min-width:180px}

const TH_M = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const td = s => S.thai ? String(s).replace(/[0-9]/g, d => '๐๑๒๓๔๕๖๗๘๙'[d]) : String(s);
function ymd(iso){ const [y,m,d] = iso.split('-').map(Number); return {y,m,d}; }
function fmtDate(iso){ const a = ymd(iso); return `${a.d} ${TH_M[a.m-1]} ${a.y+543}`; }
function fmtRange(r){
  if (!r || !r.from) return '';
  if (!r.to || r.to === r.from) return fmtDate(r.from);
  const a = ymd(r.from), b = ymd(r.to);
  if (a.y===b.y && a.m===b.m) return `${a.d} – ${b.d} ${TH_M[a.m-1]} ${a.y+543}`;
  if (a.y===b.y) return `${a.d} ${TH_M[a.m-1]} – ${b.d} ${TH_M[b.m-1]} ${a.y+543}`;
  return `${fmtDate(r.from)} – ${fmtDate(r.to)}`;
}
function fmtDT(v){ const [d,t] = v.split('T'); return fmtDate(d) + (t ? ` เวลา ${t.replace(':','')} น.` : ''); }
function fmtMoney(v){ const n = Number(String(v).replace(/[,\s]/g,'')); return isFinite(n) && String(v).trim() !== '' ? n.toLocaleString('en-US') : String(v); }
function filled(f, v){ return F[f].type === 'daterange' ? !!(v && v.from) : String(v ?? '').trim() !== ''; }
function display(f, v){
  const t = F[f].type;
  if (t === 'daterange') return td(fmtRange(v));
  if (t === 'datetime') return td(fmtDT(v));
  if (t === 'money') return td(fmtMoney(v));
  if (t === 'textnum') return td(v);
  return String(v);
}

/* A4 pages have a fixed height: content that runs past the footer flows onto continuation pages.
   Red locked blocks and numbered lists split between items; everything else moves whole. Phones show one long page instead. */
const bottomOf = el => el.getBoundingClientRect().bottom;
function splitAt(box, limit, isBody){
  const kids = [...box.children].filter(k => !k.classList.contains('lk-tag'));
  const k = kids.findIndex(c => bottomOf(c) > limit);
  if (k < 0) return null;
  const c = kids[k], out = box.cloneNode(false);
  if (box.classList.contains('lockblk')) { out.style.marginTop = '0'; const tag = box.querySelector(':scope > .lk-tag'); if (tag) out.appendChild(tag.cloneNode(true)); }
  if (box.tagName === 'OL') out.start = (box.start || 1) + k;
  const inner = [...c.children].filter(x => !x.classList.contains('lk-tag'));
  const splittable = (c.classList.contains('lockblk') || c.tagName === 'OL') && inner.length > 1 && bottomOf(inner[0]) <= limit;
  if (splittable) {
    const part = splitAt(c, limit, false);
    if (part) { out.append(part, ...kids.slice(k + 1)); return out; }

function paginate(doc){
  if (!doc.offsetParent) return; /* hidden tab: measured again when the builder is shown */
  const first = doc.querySelector('.page');
  if (!first || getComputedStyle(first).aspectRatio === 'auto') return;
  for (let i = 1, guard = 0; i < doc.children.length && guard < 60; i++, guard++) {
    const page = doc.children[i], body = page.querySelector('.body'), foot = page.querySelector('.pfoot');
    if (!body || !foot || !body.lastElementChild) continue;
    const limit = page.getBoundingClientRect().top + page.clientHeight - parseFloat(getComputedStyle(page).paddingBottom) - foot.offsetHeight - parseFloat(getComputedStyle(foot).marginTop);
    if (bottomOf(body.lastElementChild) <= limit + 1) continue;
    const part = splitAt(body, limit, true);
    if (!part) continue;
    const next = page.cloneNode(false);
    next.append(part, foot.cloneNode(true));
    page.after(next);
  }

}

function readImage(file){
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('type'));
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const nw = img.naturalWidth || 300, nh = img.naturalHeight || 300, r = nw / nh;
        if (file.type === 'image/svg+xml' && fr.result.length < 300000) return res({src:fr.result, r});
        const k = Math.min(1, 720 / Math.max(nw, nh)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(nw * k)); c.height = Math.max(1, Math.round(nh * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let src = c.toDataURL('image/webp', .9);
        if (!src.startsWith('data:image/webp')) src = c.toDataURL('image/png');
        res({src, r});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

let blobCache = {key:'', url:''};
function fileUrl(f){
  const key = f.name + f.ver + f.at;
  if (blobCache.key === key) return blobCache.url;
  if (blobCache.url) URL.revokeObjectURL(blobCache.url);
  const [head, data] = f.data.split(','), bin = atob(data), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  blobCache = {key, url:URL.createObjectURL(new Blob([arr], {type:head.slice(5).split(';')[0] || f.type}))};
  return blobCache.url;
}

function loadExcel(){

async function downloadEntry(){

function uploadSched(file){
  const b = D(); if (!editable() || !file) return;
  const okType = /pdf|sheet|excel|image\/(png|jpe?g)/.test(file.type) || /\.(pdf|xlsx?|png|jpe?g)$/i.test(file.name);
  if (!okType) { S.flash = {t:'รับเฉพาะไฟล์ PDF, Excel, JPG หรือ PNG'}; renderFlow(); return; }
  const done = data => {
    if (b.schedFile) (b.schedHist = b.schedHist || []).push({name:b.schedFile.name, size:b.schedFile.size, at:b.schedFile.at, ver:b.schedFile.ver});
    b.schedFile = {name:file.name, type:file.type || '', size:file.size, at:now(), ver:b.schedFile ? b.schedFile.ver + 1 : 1, data};
    log(b, `อัปโหลดตารางการแข่งขัน v${b.schedFile.ver} (${file.name})`); S.flash = null;
    if (!save()) { b.schedFile.data = null; save(); }
    renderAll();
  };
  if (file.size > MAXFILE) { done(null); return; }
  const fr = new FileReader(); fr.onload = () => done(fr.result); fr.readAsDataURL(file);
}

/* note = {id, key, label, text, by, role, at, state:'open'|'fixed'|'closed', reply, replyAt, closedBy}

const COMMENTERS = ['admin', 'reviewer', 'approver', 'approver_pony'];

const NOTE_STATE = {open:'รอแก้', fixed:'ผู้จัดแก้แล้ว รอตรวจ', closed:'ปิดแล้ว'};

  return b.notes;
}
function syncComments(b){

}

function apSet(t){
  const b = applyBook(); if (!b || !entryOpen(b)) return false;
  const ap = apDraft(b);
  if (t.dataset.ap) ap[t.dataset.ap] = t.value;
  else if (t.dataset.rk) { const r = ap.riders[+t.dataset.rr]; if (r) r[t.dataset.rk] = t.value; }
  else if (t.dataset.rc) { const r = ap.riders[+t.dataset.rc]; if (r) r.cls[t.dataset.cid] = t.checked; }
  else if (t.dataset.stall) ap.stall[t.dataset.stall] = t.value;
  else if (t.dataset.st) {
    const s = (ap.stable[t.dataset.st] = ap.stable[t.dataset.st] || {});
    s[t.dataset.sk] = t.type === 'checkbox' ? t.checked : t.value;
    if (t.dataset.sk === 'on' && t.checked) { const a = arrival(b); s.in = s.in || ap.stall.in || a.in; s.out = s.out || ap.stall.out || a.out; s.type = s.type || ap.stall.type || 'ถาวร'; }
  } else return false;
  return true;
}
/* paste a block copied from Excel: rows go down from the cell, columns follow GCOLS from the cell's column */
function apPasteRows(b, text, row, col){
  const ap = apDraft(b), lines = text.replace(/\r/g, '').split('\n');
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  lines.forEach((line, k) => {
    const cells = line.split('\t'), i = row + k;
    while (ap.riders.length <= i) ap.riders.push(newRider());
    cells.forEach((val, j) => { const key = GCOLS[col + j]; if (key) ap.riders[i][key] = key === 'cat' ? normCat(val) : val.trim(); });
  });
  return lines.length;
}

function renderStaff(){

  document.getElementById('staff').innerHTML = `<div><div class="eyebrow">TEF Admin</div><h1>ทะเบียนคนทำงาน</h1><p class="lead">ระบบใช้รายชื่อนี้หาอีเมลของประธานกรรมการตัดสิน หัวหน้ากรรมการประจำสนาม และหัวหน้าสัตวแพทย์ เพื่อส่งแบบฟอร์มรายงานอัตโนมัติเมื่อประกาศคู่มือ และใช้เป็นตัวเลือกตอนผู้จัดกรอกรายชื่อ ชื่อต้องสะกดตรงกับที่กรอกในคู่มือ</p></div>
    <div class="panel"><div class="form-grid"><label>ชื่อ-นามสกุล<input class="inp" id="rg-name"></label><label>ตำแหน่ง<input class="inp" id="rg-pos" placeholder="เช่น ประธานกรรมการตัดสิน"></label><label>อีเมล<input class="inp" type="email" id="rg-email"></label><button type="button" class="btn primary" data-do="reg-add">เพิ่ม</button></div>
    <details class="more" style="margin-top:12px"><summary>วางรายชื่อจาก Excel</summary><p class="hint">คัดลอก 3 คอลัมน์ ชื่อ · ตำแหน่ง · อีเมล จาก Excel แล้ววางที่นี่ หนึ่งคนต่อหนึ่งบรรทัด</p><textarea class="inp" id="rg-paste" rows="4"></textarea><div class="row-acts" style="margin-top:8px"><button type="button" class="btn" data-do="reg-paste">นำเข้า</button><span class="hint" id="rg-note"></span></div></details></div>
    ${S.reg.length ? `<div class="tbl-wrap"><table><thead><tr><th>ชื่อ</th><th>ตำแหน่ง</th><th>อีเมล</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="panel empty">ยังไม่มีรายชื่อ รอไฟล์รายชื่อคนทำงานจาก TEF</div>'}`;
}
function renderMail(){
  const u = me(), all = u.role === 'admin' && !S.mineOnly ? S.mail : S.mail.filter(m => m.ids.includes(u.id));
  const card = m => `<details class="mail"><summary><b>${esc(m.subject)}</b><small>${fmtTs(m.at)}</small><small>ถึง ${esc(m.to.join(', '))}</small></summary><div class="mail-meta"><span>ถึง</span><span>${esc(m.to.join(', '))}</span>${m.cc.length ? `<span>สำเนา</span><span>${esc(m.cc.join(', '))}</span>` : ''}<span>จาก</span><span>ระบบ TEF (${INFO})</span></div><pre class="mail-body">${esc(m.body)}</pre>${m.attach.map(a => `<span class="att">แนบ: ${esc(a)}</span>`).join('')}${m.book ? `<div style="margin-top:8px"><button type="button" class="add" data-open="${m.book}">เปิดคู่มือ →</button></div>` : ''}</details>`;
  document.getElementById('mail').innerHTML = `<div class="head-row"><div><div class="eyebrow">ต้นแบบ · อีเมลไม่ได้ส่งจริง</div><h1>${u.role === 'admin' && !S.mineOnly ? 'อีเมลที่ระบบส่งทั้งหมด' : 'อีเมลถึงฉัน'}</h1><p class="lead">ระบบจริงส่งจากกล่อง ${INFO} ตามเหตุการณ์ด้านล่าง หน้านี้ให้เห็นว่าใครได้รับอะไร เมื่อไหร่</p></div>${u.role === 'admin' ? `<label class="sw"><input type="checkbox" data-do="mine"${S.mineOnly ? ' checked' : ''}> เฉพาะที่ถึงฉัน</label>` : ''}</div>
    ${all.length ? `<div class="mail-list">${all.map(card).join('')}</div>` : '<div class="panel empty">ยังไม่มีอีเมล</div>'}`;
}
function renderLogin(){
  const accts = S.users.filter(x => x.role !== 'rejected');
  document.getElementById('login').innerHTML = `<div class="login-mock"><div class="seal">TEF</div><h3>THC Online Draft Schedule</h3><p>ระบบคู่มือการแข่งขัน ประเภทศิลปะบังคับม้า (Dressage)</p>
    <button type="button" class="btn primary gbtn" data-do="google">เข้าสู่ระบบด้วย Google</button><small>ใช้บัญชี Gmail ระบบไม่เห็นรหัสผ่าน · ผู้ใช้ใหม่ต้องรอ TEF Admin อนุมัติก่อนสร้างคู่มือ</small>
    <div class="demo"><span class="eyebrow">บัญชีทดลอง (จำลอง) · คลิกเพื่อเข้าในบัญชีนั้น</span><div id="demo-accounts">${accts.map(x => `<button type="button" class="acct" data-do="as" data-arg="${x.id}"><b>${esc(x.name)}</b><small>${esc(ROLES[x.role].th)}${x.email ? ' · ' + esc(x.email) : ''}</small></button>`).join('')}</div></div></div>`;
}
function renderPending(){
  const u = me(), no = u.role === 'rejected';
  document.getElementById('pending').innerHTML = `<div class="login-mock"><div class="seal">TEF</div><h3>${no ? 'ไม่ได้รับอนุมัติ' : 'รอ TEF Admin อนุมัติ'}</h3><p>${esc(u.name)} · ${esc(u.email)}</p>
    <small>${no ? 'ติดต่อ TEF หากต้องการสิทธิ์ผู้จัดการแข่งขัน' : `ส่งคำขอเมื่อ ${fmtTs(u.at)} เมื่ออนุมัติแล้วคุณจะได้รับอีเมล และสร้างคู่มือในฐานะผู้จัดการแข่งขันได้`}</small>
    <button type="button" class="btn" data-do="logout" style="margin-top:8px">ออกจากระบบ</button>
    ${no ? '' : '<div class="demo"><span class="eyebrow">ทดลอง</span><button type="button" class="acct" data-do="as" data-arg="u-admin"><b>สลับเป็น TEF Admin เพื่ออนุมัติ</b></button></div>'}</div>`;
}
function googleDialog(){
  const f = document.getElementById('dlg-form');
  f.innerHTML = `<h3>Sign in with Google (จำลอง)</h3><p class="hint" style="margin:0">ระบบจริงเปิดหน้าต่าง Google ให้เลือกบัญชี ต้นแบบนี้ให้พิมพ์ชื่อและอีเมล Gmail แทน</p>
    <label class="fld"><span class="lab">ชื่อ-นามสกุล</span><input class="inp" name="name" required></label>
    <label class="fld"><span class="lab">อีเมล Gmail</span><input class="inp" name="email" type="email" required placeholder="name@gmail.com"></label>
    <div class="dlg-acts"><button type="button" class="btn" id="g-cancel">ยกเลิก</button><button type="submit" class="btn primary">ดำเนินการต่อ</button></div>`;
  document.getElementById('g-cancel').onclick = () => dlg.close();
  f.onsubmit = e => {
    e.preventDefault();
    const name = f.name.value.trim(), email = f.email.value.trim().toLowerCase();
    if (!name || !email) return;
    dlg.close();
    let u = S.users.find(x => x.email && x.email.toLowerCase() === email);
    if (!u) {
      u = {id:rid('u'), name, email, role:'pending', at:now()};
      S.users.push(u);
      sendMail({to:holders('admin'), subject:`[ขอเข้าใช้งาน] ${name}`, body:`${name} (${email}) เข้าสู่ระบบด้วย Google และขอสิทธิ์ผู้จัดการแข่งขัน\nอนุมัติได้ที่หน้า “ผู้ใช้”`});
    }
    S.me = u.id; S.view = 'books'; save(); renderAll();
  };
  dlg.showModal();
}

/* ---------- header, demo strip, routing ---------- */
const VIEWS = {apply:'v-apply', login:'v-login', pending:'v-pending', books:'v-books', edit:'v-builder', users:'v-users', staff:'v-staff', mail:'v-mail'};
function hdrHeight(){ const h = document.querySelector('.top'); if (h) document.documentElement.style.setProperty('--hdr', (h.offsetHeight + 8) + 'px'); }
window.addEventListener('resize', hdrHeight);
function renderHeader(v){
  const u = me(), nav = document.getElementById('nav'), who = document.getElementById('who');
  if (!u || ['pending','rejected'].includes(u.role)) { nav.innerHTML = ''; who.innerHTML = u ? `<button type="button" class="btn" data-do="logout">ออกจากระบบ</button>` : ''; return; }
  const tabs = [['books', u.role === 'organizer' ? 'คู่มือของฉัน' : 'คู่มือ']];
  if (u.role === 'admin') tabs.push(['users', 'ผู้ใช้' + (holders('pending').length ? `<span class="badge">${td(holders('pending').length)}</span>` : '')], ['staff', 'ทะเบียนคนทำงาน']);
  tabs.push(['mail', 'อีเมล']);
  nav.innerHTML = tabs.map(([k, t]) => `<a href="#" data-go="${k}"${(v === k || (v === 'edit' && k === 'books')) ? ' aria-current="page"' : ''}>${t}</a>`).join('');
  who.innerHTML = `<div class="av" aria-hidden="true">${esc(u.name.replace(/^คุณ/, '').trim().charAt(0))}</div><div class="who-t"><b>${esc(u.name)}</b><small>${esc(ROLES[u.role].th)}</small></div><button type="button" class="btn" data-do="logout">ออกจากระบบ</button>`;
}
function renderStrip(){
  document.getElementById('strip').innerHTML = `<b>โหมดทดลอง</b><span>ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น อีเมลไม่ได้ส่งจริง</span><span class="sp"></span><span>วันที่จำลอง ${fmtD(now())}</span><button type="button" class="btn" data-do="clock" data-arg="1">+๑ วัน</button><button type="button" class="btn" data-do="clock" data-arg="3">+๓ วัน</button><button type="button" class="btn" data-do="clock" data-arg="0">วันนี้</button><button type="button" class="btn" data-do="wipe">ล้างข้อมูลทดลอง</button><a class="btn" href="prototype.html">ต้นแบบ 3 ประเภท</a>`;
}
function renderAll(){
  syncRole(); S.books.forEach(b => { notesOf(b); syncComments(b); }); tick();
  const u = me();
  let v = S.applyFor ? 'apply' : !u ? 'login' : ['pending','rejected'].includes(u.role) ? 'pending' : S.view;
  if (v === 'edit' && !canSee(D())) v = 'books';
  if ((v === 'users' || v === 'staff') && (!u || u.role !== 'admin')) v = 'books';
  if (!VIEWS[v]) v = 'books';
  Object.entries(VIEWS).forEach(([k, id]) => { document.getElementById(id).hidden = k !== v; });
  renderStrip(); renderHeader(v); hdrHeight();
  document.getElementById('registry').innerHTML = S.reg.map(r => `<option value="${esc(r.name)}" label="${esc(r.pos)}"></option>`).join('');
  if (v === 'apply') renderApply();
  else if (v === 'login') renderLogin();
  else if (v === 'pending') renderPending();
  else if (v === 'books') renderBooks();
  else if (v === 'users') renderUsers();
  else if (v === 'staff') renderStaff();
  else if (v === 'mail') renderMail();
  else { renderDocTabs(); syncOpts(); if (S.tab === 'handbook') { renderRail(); renderDoc(); } renderStatus(); }
  save();
}
/* status-bar "สลับเป็น…" buttons (demo): sign in as whoever the handbook is waiting for */
function setRole(r){
  const b = D(), u = r === 'owner' ? ownerOf(b) : holders(r)[0];
  if (!u) return; S.me = u.id; S.flash = null; save(); renderAll();
}
const dlg = document.getElementById('dlg');
const go = v => { S.view = v; S.flash = null; save(); renderAll(); window.scrollTo(0, 0); };
function openBook(id){ if (!S.books.some(b => b.id === id)) return; S.cur = id; S.showMiss = false; go('edit'); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-open],[data-do],[data-tab],[data-jump]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; save(); renderAll(); if (t.closest('#doc-tabs')) window.scrollTo({top:0, behavior:'smooth'}); return; }
  if (t.dataset.jump) { if (t.closest('#rail')) return; if (TAB_KEYS[t.dataset.jump]) { S.tab = t.dataset.jump; renderAll(); } else { S.tab = 'handbook'; renderAll(); focusField(t.dataset.jump); } return; }
  if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); return; }
  if (t.dataset.open) { openBook(t.dataset.open); return; }
  const d = t.dataset.do, arg = t.dataset.arg, b = D(), u = me();
  if (d === 'google') googleDialog();
  else if (d === 'ap-open') { location.hash = 'apply-' + b.id; }
  else if (d === 'ap-back') { S.apDone = null; history.pushState(null, '', location.pathname + location.search); applyRoute(); renderAll(); window.scrollTo(0, 0); }
  else if (d === 'ap-new') { S.apDone = null; renderAll(); window.scrollTo(0, 0); }
  else if (d === 'ap-add') { const ab = applyBook(); if (ab && entryOpen(ab)) { const ap = apDraft(ab), at = ap.riders.length; for (let k = 0; k < (Number(arg) || 1); k++) ap.riders.push(newRider()); save(); renderApply({row:at, key:'name'}); } }
  else if (d === 'ap-paste') apPasteDialog();
  else if (d === 'ap-clean') { const ab = applyBook(); if (ab) { const ap = apDraft(ab); ap.riders = ap.riders.filter(r => !rowEmpty(r)); if (!ap.riders.length) ap.riders.push(newRider()); save(); renderApply(); } }
  else if (d === 'ap-stall-all' || d === 'ap-stall-none') { const ab = applyBook(); if (ab && entryOpen(ab)) { const ap = apDraft(ab), a = arrival(ab); apHorses(ap).forEach(h => { const s0 = (ap.stable[h.name] = ap.stable[h.name] || {}); if (d === 'ap-stall-none') s0.on = false; else Object.assign(s0, {on:true, type:ap.stall.type || 'ถาวร', in:ap.stall.in || a.in, out:ap.stall.out || a.out}); }); save(); const st = document.getElementById('ap-stable'); st.dataset.sig = ''; st.innerHTML = stableHtml(ab, ap, apTotals(ab, ap), true); apRefresh(); } }
  else if (d === 'ap-slip') document.getElementById('slip-file').click();
  else if (d === 'ap-submit') apSubmit();
  else if (d === 'entries-xlsx') downloadEntries();
  else if (d === 'note-add') {
    const txt = document.getElementById('note-text'), key = arg !== undefined && arg !== '' ? arg : document.getElementById('note-key').value;
    if (!txt || !txt.value.trim() || !canComment(b)) { if (txt) txt.focus(); return; }
    addNote(b, key, txt.value.trim()); log(b, `คอมเมนต์ ${cmtLabel(key)}`); S.noteKey = key; save(); renderAll();
  }
  else if (d === 'note-fixed' || d === 'note-close' || d === 'note-reopen') {
    const n = notesOf(b).find(x => x.id === arg); if (!n) return;
    if (d === 'note-fixed' && editable()) { const r = document.querySelector(`[data-reply="${arg}"]`); n.state = 'fixed'; n.reply = r ? r.value.trim() : ''; n.replyAt = now(); log(b, `ผู้จัดแก้คอมเมนต์ ${n.label}`); }
    else if (d === 'note-close' && canComment(b)) { n.state = 'closed'; n.closedBy = u.name; log(b, `ปิดคอมเมนต์ ${n.label}`); }
    else if (d === 'note-reopen' && canComment(b)) { n.state = 'open'; n.closedBy = ''; log(b, `เปิดคอมเมนต์ ${n.label} ใหม่`); }
    else return;
    syncComments(b); save(); renderAll();
  }
  else if (d === 'sched-up') document.getElementById('sched-file').click();
  else if (d === 'ret-sched') openReturn('sched');
  else if (d === 'xlsx') downloadEntry();
  else if (d === 'as') { S.me = arg; S.view = 'books'; save(); renderAll(); }
  else if (d === 'logout') { S.me = null; save(); renderAll(); }
  else if (d === 'clock') { S.clock = arg === '0' ? 0 : S.clock + Number(arg); save(); renderAll(); }
  else if (d === 'wipe') { if (confirm('ล้างข้อมูลทดลองทั้งหมดในเบราว์เซอร์นี้?')) { S = fresh(); save(); renderAll(); } }
  else if (d === 'new' && u && u.role === 'organizer') {
    const nb = {id:rid('b'), owner:u.id, created:now(), status:'draft', ver:'0.1', values:{}, people:{}, comments:[], hist:[], approvals:{}, reports:{}, pony:false, round:0};
    S.books.unshift(nb); S.cur = nb.id; log(nb, 'สร้างคู่มือ'); openBook(nb.id);
  }
  else if (d === 'allow' || d === 'deny') {
    const x = S.users.find(y => y.id === arg); if (!x) return;
    x.role = d === 'allow' ? 'organizer' : 'rejected'; x.okAt = now();
    sendMail({to:[x], cc:holders('admin'), subject: d === 'allow' ? '[อนุมัติแล้ว] เข้าใช้งานในฐานะผู้จัดการแข่งขัน' : '[ไม่อนุมัติ] คำขอเข้าใช้งาน', body: d === 'allow' ? `เรียน ${x.name}\n\nTEF Admin อนุมัติให้คุณเข้าใช้งานในฐานะผู้จัดการแข่งขันแล้ว เข้าสู่ระบบด้วย Gmail เดิมเพื่อสร้างคู่มือ` : `เรียน ${x.name}\n\nคำขอเข้าใช้งานไม่ได้รับอนุมัติ กรุณาติดต่อ TEF`});
    save(); renderAll();
  }
  else if (d === 'late-ok' && u.role === 'admin') { b.lateOk = true; log(b, 'TEF Admin อนุญาตให้ส่งเกินกำหนด ๔๕ วัน'); sendMail({to:[ownerOf(b)], cc:holders('admin'), book:b.id, subject:`[อนุญาตส่งช้า] ${eventName(b)}`, body:`TEF Admin อนุญาตให้ส่งคู่มือ ${eventName(b)} หลังกำหนด ๔๕ วันก่อนวันแข่งได้\n\n${link(b)}`}); save(); renderStatus(); }
  else if (d === 'got') { const r = b.reports[arg]; if (r) { r.receivedAt = now(); log(b, `ได้รับรายงาน${REPORTERS.find(x => x.r === arg).th}`); save(); renderStatus(); } }
  else if (d === 'resend' && u.role === 'admin') { sendReport(b, REPORTERS.find(x => x.r === arg), reportDue(b)); log(b, `ส่งแบบฟอร์มให้${REPORTERS.find(x => x.r === arg).th}อีกครั้ง`); save(); renderStatus(); }
  else if (d === 'xlsx') { const fi = document.getElementById('xlsx-file'); fi.value = ''; fi.click(); }
  else if (d === 'reg-add') {
    const n = document.getElementById('rg-name').value.trim(), p = document.getElementById('rg-pos').value.trim(), m = document.getElementById('rg-email').value.trim();
    if (!n) return; S.reg.push({name:n, pos:p, email:m}); save(); renderAll();
  }
  else if (d === 'reg-paste') {
    const lines = document.getElementById('rg-paste').value.split(/\r?\n/).map(l => l.split(/\t|,/).map(x => x.trim())).filter(c => c[0]);
    lines.forEach(([n, p = '', m = '']) => { const ex = S.reg.find(r => r.name === n); if (ex) Object.assign(ex, {pos:p || ex.pos, email:m || ex.email}); else S.reg.push({name:n, pos:p, email:m}); });
    save(); renderAll(); const note2 = document.getElementById('rg-note'); if (note2) note2.textContent = `นำเข้า ${td(lines.length)} รายชื่อ`;
  }
  else if (d === 'reg-rm') { S.reg.splice(Number(arg), 1); save(); renderAll(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'note-key') { S.noteKey = t.value; return; }
  if (t.dataset.do === 'pony' && editable()) { D().pony = t.checked; log(D(), t.checked ? 'ระบุว่ามีรุ่นโพนี' : 'ระบุว่าไม่มีรุ่นโพนี'); save(); renderStatus(); }
  else if (t.dataset.do === 'mine') { S.mineOnly = t.checked; save(); renderAll(); }
  else if (t.dataset.email) { const x = S.users.find(y => y.id === t.dataset.email); if (x) { x.email = t.value.trim(); save(); } }
  else if (t.id === 'xlsx-file' && t.files[0]) { const b = D(); b.reports.results = Object.assign({}, b.reports.results, {receivedAt:now(), file:t.files[0].name}); log(b, `ได้รับผลการแข่งขัน ${t.files[0].name}`); save(); renderStatus(); }
});
document.getElementById('doc').addEventListener('click', e => {
  const b = D(); if (!canComment(b) || editable()) return;
  const v = e.target.closest('.v'); if (!v) return;
  e.stopPropagation();
  S.noteKey = v.dataset.cover ? 'cover' : v.dataset.f ? v.dataset.f : v.dataset.r ? 'r:' + v.dataset.r : '';
  renderFlow();
  const box = document.getElementById('notes'); if (box) box.scrollIntoView({block:'center', behavior:'smooth'});
  setTimeout(() => { const t = document.getElementById('note-text'); if (t) t.focus({preventScroll:true}); }, 300);
}, true);
/* links in emails use #<handbook id> */
applyRoute();
const hashId = location.hash.replace('#', '');
if (hashId && S.books.some(b => b.id === hashId)) { S.cur = hashId; S.view = 'edit'; }
renderAll();
})();
</script>
